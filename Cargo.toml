[workspace]
resolver = "3"
members = ["crates/frameforge-core", "crates/frameforge-effects-bridge", "apps/frameforge-pro"]
default-members = ["crates/frameforge-core", "crates/frameforge-effects-bridge", "apps/frameforge-pro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moonvexinary-lgtm/filmforge-pro-chtgpt-version"

[workspace.dependencies]
filmcraft-time = { git = "https://github.com/storytold/filmcraft", rev = "2c5ba7a72619935f0481f99d59409e0d1844b234" }
effectcraft-effects = { git = "https://github.com/storytold/effectcraft", rev = "ef74d82902ba486891b02afa87e42963cc9b84cc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
